name: Audit

# The dependency audit has its own workflow so that the weekly schedule runs
# only this job, not all of CI. An advisory published while no PR is open is
# then caught within a week. The job name `audit` is a required check: keep it.
on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "47 19 * * 0" # Sunday 19:47 UTC = Monday 04:47 JST

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      - run: bun audit --audit-level=high
